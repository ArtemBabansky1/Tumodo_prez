<section class="slide theme-light" id="s{{num}}">
  {{{furniture}}}
  <div class="split-left">
    <h1 class="t-page-title accent">{{title}}</h1>
    {{#if lead}}<div class="t-body-middle">{{lead}}</div>{{/if}}
    <div class="spacer"></div>
    {{#if conclusion}}<div class="conclusion">{{conclusion}}</div>{{/if}}
  </div>
  <div class="split-right">
    {{#each cards}}
    <div class="card pad-m{{#if blue}} card-blue{{/if}}{{{threeDClass}}}" style="position:relative;overflow:hidden;">
      {{#if curve}}<img class="deco-curve" src="assets/patterns/curve-gray.svg" alt="" style="left:-10%;top:-30px;width:130%;">{{/if}}
      {{#if spacerTop}}<div style="flex:1;"></div>{{/if}}
      <div class="card-title">{{title}}</div>
      {{#if items}}<ul class="dots small">{{#each items}}<li class="t-body-small">{{.}}</li>{{/each}}</ul>{{/if}}
      {{#if threeD}}<img class="card-3d card-3d--{{threeDSide}}" src="{{threeD}}" alt="">{{/if}}
    </div>
    {{/each}}
  </div>
</section>
