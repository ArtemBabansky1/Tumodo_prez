<section class="slide theme-light" id="s{{num}}">
  {{#if imageBg}}<div class="bg"><img src="{{imageBg}}" alt="" style="width:100%;height:100%;object-fit:cover;"></div>{{/if}}
  {{{furniture}}}
  <div class="h1-row"><h1 class="t-page-title">{{title}}</h1></div>
  <div class="content">
    <div style="width:700px;display:flex;flex-direction:column;gap:28px;">
      {{#if lead}}<div class="t-body-big">{{lead}}</div>{{/if}}
      {{#each paragraphs}}<p class="t-body-middle">{{.}}</p>{{/each}}
    </div>
  </div>
  {{#if image}}<img src="{{image}}" alt="" style="position:absolute;right:0;bottom:0;max-width:1050px;max-height:820px;">{{/if}}
</section>
