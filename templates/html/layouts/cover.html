<section class="slide theme-blue" id="s{{num}}">
  <div class="bg"><div class="bg-pattern"></div></div>
  <img class="cover-logo" src="assets/logo/logo-white.svg" alt="Tumodo">
  <div style="position:absolute;left:120px;right:120px;bottom:140px;display:flex;flex-direction:column;gap:28px;">
    <div class="{{titleClass}}" style="max-width:1400px;">{{title}}</div>
    <div style="display:flex;align-items:center;gap:25px;">
      {{#if subtitle}}<div class="t-body-big" style="max-width:1100px;font-weight:400;">{{subtitle}}</div>{{/if}}
      <div style="flex:1;"></div>
      {{#if cta}}<div class="btn-pill">{{cta}}</div>{{/if}}
    </div>
  </div>
</section>
