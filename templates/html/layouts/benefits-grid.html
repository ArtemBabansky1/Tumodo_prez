<section class="slide theme-light" id="s{{num}}">
  {{{furniture}}}
  <h1 class="t-page-title accent" style="position:absolute;left:120px;top:200px;max-width:1200px;">{{title}}</h1>
  <div class="service-grid {{gridFit}}">
    {{#each cards}}
    <div class="service-card">
      {{#if icon}}<div class="service-icon"><img src="{{icon}}" alt=""></div>{{/if}}
      <div class="card-title">{{title}}</div>
      {{#if text}}<div class="card-text">{{text}}</div>{{/if}}
      {{#if items}}<ul class="dots">{{#each items}}<li>{{.}}</li>{{/each}}</ul>{{/if}}
    </div>
    {{/each}}
    {{#if sideTitle}}
    <div class="card side-card pad-m">
      <div class="card-title">{{sideTitle}}</div>
      <ul class="dots">{{#each sideItems}}<li>{{{.}}}</li>{{/each}}</ul>
    </div>
    {{/if}}
  </div>
</section>
